<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="calculator-container">
    <div id="display" ></div>
    <div id="buttons-container">
      <button class="calculator-button" number="7">7</button>
      <button class="calculator-button" number="8">8</button>
      <button class="calculator-button" number="9">9</button>
      <button class="calculator-button" id="clear">clear</button>
      <button class="calculator-button" number="4">4</button>
      <button class="calculator-button" number="5">5</button>
      <button class="calculator-button" number="6">6</button>
      <button class="calculator-button" operator="multiply">*</button>
      <button class="calculator-button" number="1">1</button>
      <button class="calculator-button" number="2">2</button>
      <button class="calculator-button" number="3">3</button>
      <button class="calculator-button" operator="subtract">-</button>
      <button class="calculator-button" number="0">0</button>
      <button class="calculator-button" decimal=".">.</button>
      <button class="calculator-button" operator="divide">/</button>
      <button class="calculator-button" operator="add">+</button>
      <button class="calculator-button" id="equal">=</button>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
